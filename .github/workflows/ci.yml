name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repo
        uses: actions/checkout@v7

      - name: install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: rustfmt check
        run: cargo fmt --all -- --check

  cmudict:
    name: download CMU dictionary
    needs: [format]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: toolchain
        uses: dtolnay/rust-toolchain@stable
      # Tests share cached dictionary files; create them once so parallel
      # tests never read one mid-write.
      - name: generate dictionary files
        run: |
          cargo test --doc cmu::CmuDict::encoding
          cp cmudict.json cmudict.test
      - uses: actions/upload-artifact@v7
        with:
          name: cmudict
          path: |
            cmudict.json
            cmudict.test

  test-macos-latest-stable:
    name: macos-latest test suite stable
    needs: [cmudict]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: download CMU dictionary
        uses: actions/download-artifact@v8
        with:
          name: cmudict
      - name: cargo test
        run: cargo test

  test-macos-latest-nightly:
    name: macos-latest test suite nightly
    needs: [cmudict]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: toolchain
        uses: dtolnay/rust-toolchain@nightly
      - name: download CMU dictionary
        uses: actions/download-artifact@v8
        with:
          name: cmudict
      - name: cargo test
        run: cargo test

  test-windows-latest-stable:
    name: windows-latest test suite stable
    needs: [cmudict]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: download CMU dictionary
        uses: actions/download-artifact@v8
        with:
          name: cmudict
      - name: cargo test
        run: cargo test

  test-windows-latest-nightly:
    name: windows-latest test suite nightly
    needs: [cmudict]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: toolchain
        uses: dtolnay/rust-toolchain@nightly
      - name: download CMU dictionary
        uses: actions/download-artifact@v8
        with:
          name: cmudict
      - name: cargo test
        run: cargo test

  test-with-coverage:
    name: ubuntu-latest test suite with coverage
    needs: [cmudict]
    runs-on: ubuntu-latest
    container:
      image:  xd009642/tarpaulin:develop-nightly
      options: --security-opt seccomp=unconfined    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: download CMU dictionary
        uses: actions/download-artifact@v8
        with:
          name: cmudict
      - name: Generate code coverage
        run: |
          ls
          cargo +nightly tarpaulin \
          --verbose --all-features --workspace --timeout 120 \
          --out Lcov --output-dir ./coverage
      - name: Upload to Coveralls   
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

  test-ubuntu-latest-nightly:
    name: ubuntu-latest test suite nightly
    needs: [cmudict]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: toolchain
        uses: dtolnay/rust-toolchain@nightly
      - name: download CMU dictionary
        uses: actions/download-artifact@v8
        with:
          name: cmudict
      - name: cargo test
        run: cargo test
